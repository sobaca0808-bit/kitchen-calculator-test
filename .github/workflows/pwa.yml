name: PWA safety and offline checks
on:
  push:
    branches: [feature/installable-pwa]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install disposable browser and icon-test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/pwa-tools" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          python3 -m venv "$RUNNER_TEMP/pwa-python"
          "$RUNNER_TEMP/pwa-python/bin/pip" install Pillow==12.0.0
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils xvfb xauth
      - name: Validate icons, reproducible builds and unchanged data stores
        run: |
          PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/pwa-python/bin/python" tests/pwa-build.test.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/verify-release.test.py
          python3 scripts/prepare-pwa-test-versions.py --output "$RUNNER_TEMP/pwa-versions" --source '${{ github.sha }}'
      - name: Verify offline CRUD, photos, JSON, printing, cold starts and safe updates
        env:
          NODE_PATH: ${{ runner.temp }}/pwa-tools/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
          KITCHEN_PWA_V1: ${{ runner.temp }}/pwa-versions/a
          KITCHEN_PWA_V2: ${{ runner.temp }}/pwa-versions/b
          KITCHEN_PWA_BAD: ${{ runner.temp }}/pwa-versions/bad
          KITCHEN_PWA_ARTIFACTS: ${{ runner.temp }}/pwa-proof
        run: node tests/pwa.browser.test.js
      - name: Install and launch an actual desktop PWA in graphical Chrome
        env:
          NODE_PATH: ${{ runner.temp }}/pwa-tools/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
          KITCHEN_PWA_V1: ${{ runner.temp }}/pwa-versions/a
          KITCHEN_PWA_HEADFUL: '1'
          KITCHEN_PWA_ARTIFACTS: ${{ runner.temp }}/pwa-native-proof
        run: xvfb-run -a node tests/pwa-install.browser.test.js
      - name: Verify the eventual main release can package PWA without changing storage
        run: python3 scripts/release-pages.py --output "$RUNNER_TEMP/release-site" --proof "$RUNNER_TEMP/release-proof.json" --legacy-runtime "$RUNNER_TEMP/legacy-runtime.json"
      - name: Run complete calculator regressions in all three themes
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/pwa-tools/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
          KITCHEN_TEST_ARTIFACT_ROOT: ${{ runner.temp }}/pwa-regressions
        run: node scripts/check-preview.mjs 2>&1 | tee "$RUNNER_TEMP/pwa-regressions.log"
      - name: Save PWA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-safety-proof
          path: |
            ${{ runner.temp }}/pwa-proof
            ${{ runner.temp }}/pwa-native-proof
            ${{ runner.temp }}/release-proof.json
            ${{ runner.temp }}/pwa-regressions.log
