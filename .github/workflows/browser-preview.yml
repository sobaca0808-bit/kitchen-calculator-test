name: Publish isolated browser preview

on:
  push:
    branches: [preview/browser]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Share the existing Pages lock; do not cancel an existing main deployment.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      EXPENSES_SOURCE: 1c1fcc057370f04a0451bf62ef6241a1edeb7587
      EXPENSES_PR: '23'
      TOGGLE_SOURCE: 6cf49ce304b9ddf0e3c6de2d780537f12cbf8e7b
      TOGGLE_PR: '24'
      FINAL_SOURCE: 662a12af04b3f446470a8405e6ec9cd2062fd5b7
      FINAL_PR: '25'
      FINAL_CHECK_RUN: '43865137744'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}final/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify main has not moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)" = 63443c53d2c7a99060584d54eae0e9c779475405
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/warm-professional-kitchen --jq .object.sha)" = 04c98fb20444859454fc18fd6f3d6e0429818f8b
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/fix/issue-21-preview-persistence --jq .object.sha)" = 1a68adffd2046b758b683af3b516adf944081149
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/establishment-expenses --jq .object.sha)" = "$EXPENSES_SOURCE"
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/per-recipe-expenses --jq .object.sha)" = "$TOGGLE_SOURCE"
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/release/unified-review --jq .object.sha)" = "$FINAL_SOURCE"
          test "$(gh api repos/${{ github.repository }}/actions/runs/$FINAL_CHECK_RUN --jq .head_sha)" = "$FINAL_SOURCE"
          test "$(gh api repos/${{ github.repository }}/actions/runs/$FINAL_CHECK_RUN --jq .conclusion)" = success
      - name: Build preview without changing any existing base file
        run: python3 preview-hosting/prepare-pages.py --output "$RUNNER_TEMP/pages-combined" --proof "$RUNNER_TEMP/pages-proof.json"
      - name: Append isolated PR22 sandbox without changing root or approved preview
        run: python3 preview-hosting/pr22/build.py --pages "$RUNNER_TEMP/pages-combined" --old-proof "$RUNNER_TEMP/pages-proof.json" --proof "$RUNNER_TEMP/pr22-proof.json"
      - name: Append establishment expenses with its own storage
        run: python3 preview-hosting/expenses/build.py --pages "$RUNNER_TEMP/pages-combined" --previous-proof "$RUNNER_TEMP/pr22-proof.json" --proof "$RUNNER_TEMP/expenses-proof.json" --source "$EXPENSES_SOURCE" --pr "$EXPENSES_PR"
      - name: Append per-recipe toggle sandbox without replacing earlier tests
        run: python3 preview-hosting/expense-toggle/build.py --pages "$RUNNER_TEMP/pages-combined" --previous-proof "$RUNNER_TEMP/expenses-proof.json" --proof "$RUNNER_TEMP/toggle-proof.json" --source "$TOGGLE_SOURCE" --pr "$TOGGLE_PR"
      - name: Append unified candidate while preserving all older calculators
        run: python3 preview-hosting/final/build.py --pages "$RUNNER_TEMP/pages-combined" --previous-proof "$RUNNER_TEMP/toggle-proof.json" --proof "$RUNNER_TEMP/final-proof.json" --source "$FINAL_SOURCE" --pr "$FINAL_PR"
      - name: Verify all current calculators match preserved files
        run: python3 preview-hosting/pr22/verify.py "$RUNNER_TEMP/final-proof.json" --phase before
      - name: Upload unchanged base with the isolated preview directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-combined
      - name: Check main again immediately before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)" = 63443c53d2c7a99060584d54eae0e9c779475405
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/fix/issue-21-preview-persistence --jq .object.sha)" = 1a68adffd2046b758b683af3b516adf944081149
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/establishment-expenses --jq .object.sha)" = "$EXPENSES_SOURCE"
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/per-recipe-expenses --jq .object.sha)" = "$TOGGLE_SOURCE"
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/release/unified-review --jq .object.sha)" = "$FINAL_SOURCE"
          test "$(gh api repos/${{ github.repository }}/actions/runs/$FINAL_CHECK_RUN --jq .head_sha)" = "$FINAL_SOURCE"
          test "$(gh api repos/${{ github.repository }}/actions/runs/$FINAL_CHECK_RUN --jq .conclusion)" = success
      - name: Publish isolated preview alongside unchanged base
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify final HTTPS link and all unchanged existing calculators
        run: python3 preview-hosting/pr22/verify.py "$RUNNER_TEMP/final-proof.json" --phase after
      - name: Prepare disposable browser checks
        run: |
          python3 preview-hosting/prepare-validation.py > "$RUNNER_TEMP/preview-validation.json"
          npm install --prefix "$RUNNER_TEMP/preview-qa" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Run 60 existing UI checks in three themes against the published preview
        env:
          NODE_PATH: ${{ runner.temp }}/preview-qa/node_modules
          KITCHEN_TEST_URL: https://sobaca0808-bit.github.io/kitchen-calculator-test/preview/
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          QA_DIR="$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/preview-validation.json"))["validation_directory"])')"
          for PREVIEW_THEME in berry graphite sage; do
            KITCHEN_TEST_THEME="$PREVIEW_THEME" node "$QA_DIR/tests/browser.test.js"
          done
      - name: Verify separate storage and capture desktop and mobile
        env:
          NODE_PATH: ${{ runner.temp }}/preview-qa/node_modules
          KITCHEN_PREVIEW_URL: https://sobaca0808-bit.github.io/kitchen-calculator-test/preview/
          CHROMIUM_PATH: /usr/bin/google-chrome
          KITCHEN_PREVIEW_ARTIFACTS: ${{ runner.temp }}/preview-proof
        run: node preview-hosting/check-published.cjs
      - name: Test actual PR22 URL with isolated storage and full Chrome restarts
        env:
          NODE_PATH: ${{ runner.temp }}/preview-qa/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
          PR22_ARTIFACTS: ${{ runner.temp }}/pr22-browser-proof
        run: node preview-hosting/pr22/check.cjs
      - name: Test actual expenses URL in all themes on desktop and mobile
        env:
          NODE_PATH: ${{ runner.temp }}/preview-qa/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
          KITCHEN_TEST_URL: https://sobaca0808-bit.github.io/kitchen-calculator-test/expenses/
          KITCHEN_TEST_ARTIFACT_DIR: ${{ runner.temp }}/expenses-browser-proof
          KITCHEN_EXPENSES_NAMESPACE_JSON: '{"book":"kitchen-calculator-expenses-preview-v1","drafts":"kitchen-calculator-expenses-drafts-v1","photos":"kitchen-calculator-expenses-photos-v1","backups":"kitchen-calculator-expenses-import-backups-v1","appearance":"kitchen-calculator-expenses-appearance-v1"}'
        run: |
          python3 preview-hosting/expenses/prepare-checks.py "$EXPENSES_SOURCE" > "$RUNNER_TEMP/expenses-checks.json"
          QA_DIR="$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/expenses-checks.json"))["directory"])')"
          node "$QA_DIR/tests/establishment-expenses.browser.test.js"
      - name: Test actual per-recipe toggle URL and the 192.34 plus 74 control example
        env:
          NODE_PATH: ${{ runner.temp }}/preview-qa/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
          KITCHEN_TEST_URL: https://sobaca0808-bit.github.io/kitchen-calculator-test/expense-toggle/
          KITCHEN_TEST_ARTIFACT_DIR: ${{ runner.temp }}/toggle-browser-proof
          KITCHEN_EXPENSES_NAMESPACE_JSON: '{"book":"kitchen-calculator-expense-toggle-preview-v1","drafts":"kitchen-calculator-expense-toggle-drafts-v1","photos":"kitchen-calculator-expense-toggle-photos-v1","backups":"kitchen-calculator-expense-toggle-import-backups-v1","appearance":"kitchen-calculator-expense-toggle-appearance-v1"}'
        run: |
          python3 preview-hosting/expenses/prepare-checks.py "$TOGGLE_SOURCE" > "$RUNNER_TEMP/toggle-checks.json"
          QA_DIR="$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/toggle-checks.json"))["directory"])')"
          node "$QA_DIR/tests/establishment-expenses.browser.test.js"
      - name: Verify expenses and saved switches on the final HTTPS calculator
        env:
          NODE_PATH: ${{ runner.temp }}/preview-qa/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
          KITCHEN_TEST_URL: https://sobaca0808-bit.github.io/kitchen-calculator-test/final/
          KITCHEN_TEST_ARTIFACT_DIR: ${{ runner.temp }}/final-expenses-proof
          KITCHEN_EXPENSES_NAMESPACE_JSON: '{"book":"kitchen-calculator-final-preview-v1","drafts":"kitchen-calculator-final-drafts-v1","photos":"kitchen-calculator-final-photos-v1","backups":"kitchen-calculator-final-import-backups-v1","appearance":"kitchen-calculator-final-appearance-v1"}'
        run: |
          python3 preview-hosting/final/prepare-checks.py "$FINAL_SOURCE" > "$RUNNER_TEMP/final-checks.json"
          QA_DIR="$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/final-checks.json"))["directory"])')"
          node "$QA_DIR/tests/establishment-expenses.browser.test.js"
      - name: Verify full final-calculator persistence lifecycle on desktop and mobile
        env:
          NODE_PATH: ${{ runner.temp }}/preview-qa/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
          FINAL_ARTIFACTS: ${{ runner.temp }}/final-lifecycle-proof
        run: node preview-hosting/final/check.cjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-preview-proof
          path: |
            ${{ runner.temp }}/pages-proof.json
            ${{ runner.temp }}/preview-proof
            ${{ runner.temp }}/pr22-proof.json
            ${{ runner.temp }}/pr22-browser-proof
            ${{ runner.temp }}/expenses-proof.json
            ${{ runner.temp }}/expenses-browser-proof
            ${{ runner.temp }}/toggle-proof.json
            ${{ runner.temp }}/toggle-browser-proof
            ${{ runner.temp }}/final-proof.json
            ${{ runner.temp }}/final-expenses-proof
            ${{ runner.temp }}/final-lifecycle-proof
      - name: Report verified preview URL
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'REPORT'
          ## Isolated PR 20 browser preview
          https://sobaca0808-bit.github.io/kitchen-calculator-test/preview/

          HTTPS file hashes and desktop/mobile Chrome checks passed.
          Main and existing live files were preserved; PR 20 was not merged.

          ## Separate PR 22 persistence sandbox
          https://sobaca0808-bit.github.io/kitchen-calculator-test/pr-22/

          Three themes, desktop/mobile, 18 full Chrome starts and JSON downloads passed.
          Five sandbox storage names are independent of the approved preview and root.
          Root and /preview/ HTTPS bytes were verified unchanged; PR 22 was not merged.

          ## Establishment expenses sandbox
          https://sobaca0808-bit.github.io/kitchen-calculator-test/expenses/

          Monthly costs divided by planned portions, separate food and expense margins.
          All three themes, desktop/mobile, A4, JSON, photos, drafts and browser restart passed.
          The root, /preview/ and /pr-22/ files remain unchanged. No PR was merged.

          ## Per-recipe expense toggle sandbox
          https://sobaca0808-bit.github.io/kitchen-calculator-test/expense-toggle/

          Inline switch, per-dish JSON preferences, 192.34 / 266.34 totals and A4 detail choices passed.
          All earlier calculator files remain unchanged; no PR was merged.
          ## Unified final candidate
          https://sobaca0808-bit.github.io/kitchen-calculator-test/final/

          PRs 20, 22, 23 and 24 are present once in the same history; no PR was merged.
          Expenses, saved flags, JSON, photographs, drafts, A4 and 18 full Chrome starts passed.
          Main, the live calculator and every earlier preview remain unchanged.
          REPORT
