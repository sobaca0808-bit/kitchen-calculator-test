name: Verify and publish approved SINTEZ main release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish root and existing PWA after the owner approves the release report'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify approved source and prepare the complete release without publishing
        run: |
          test '${{ github.repository }}' = sobaca0808-bit/kitchen-calculator-test
          python3 scripts/check-sintez-core.py
          python3 scripts/check-sintez-unified.py
          python3 scripts/release-sintez.py --output "$RUNNER_TEMP/release-site" --proof "$RUNNER_TEMP/release-proof.json"
      - name: Install disposable regression tools
        run: |
          npm install --prefix "$RUNNER_TEMP/sintez-tools" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Run the full calculator regressions on merged main
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/sintez-tools/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
          KITCHEN_TEST_ARTIFACT_ROOT: ${{ runner.temp }}/regressions
        run: node scripts/check-preview.mjs 2>&1 | tee "$RUNNER_TEMP/main-regressions.log"
      - name: Verify presentation, data and launcher on the final packaged runtime
        env:
          NODE_PATH: ${{ runner.temp }}/sintez-tools/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
          KITCHEN_SINTEZ_RUNTIME_ROOT: ${{ runner.temp }}/release-site/sintez-release
          KITCHEN_INTRO_ARTIFACTS: ${{ runner.temp }}/intro-proof
          KITCHEN_SINTEZ_ARTIFACTS: ${{ runner.temp }}/home-proof
          KITCHEN_ENTRY_ARTIFACTS: ${{ runner.temp }}/entry-proof
        run: |
          export KITCHEN_SINTEZ_KEYS="$(python3 -c 'import json,os;print(json.dumps(json.load(open(os.environ["KITCHEN_SINTEZ_RUNTIME_ROOT"]+"/pwa-version.json"))["storage_names"]))')"
          node tests/sintez-intro.browser.test.js
          node tests/sintez-home.browser.test.js
          node tests/sintez-entry.browser.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: sintez-main-candidate
          path: |
            ${{ runner.temp }}/release-site
            ${{ runner.temp }}/release-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sintez-main-checks
          path: |
            ${{ runner.temp }}/main-regressions.log
            ${{ runner.temp }}/intro-proof
            ${{ runner.temp }}/home-proof
            ${{ runner.temp }}/entry-proof
  publish:
    # A merge alone must not authorize a new permanent/PWA publication.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://sobaca0808-bit.github.io/kitchen-calculator-test/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sintez-main-candidate
          path: ${{ runner.temp }}/candidate
      - name: Require a single Actions publisher and the unchanged approved main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)" = '${{ github.sha }}'
          test "$(gh api repos/${{ github.repository }}/pages --jq .build_type)" = workflow
          python3 scripts/verify-sintez-release.py "$RUNNER_TEMP/candidate/release-proof.json" --phase before
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/candidate/release-site
      - name: Recheck main immediately before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)" = '${{ github.sha }}'
      - uses: actions/deploy-pages@v4
      - name: Verify unchanged old URLs and the new root/PWA files
        run: python3 scripts/verify-sintez-release.py "$RUNNER_TEMP/candidate/release-proof.json" --phase after
      - name: Install disposable public-browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/sintez-tools" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Verify the actual root and PWA in disposable browser profiles
        env:
          NODE_PATH: ${{ runner.temp }}/sintez-tools/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
          SINTEZ_RELEASE_PROOF: ${{ runner.temp }}/candidate/release-proof.json
          SINTEZ_RELEASE_ARTIFACTS: ${{ runner.temp }}/release-live
        run: node scripts/verify-sintez-main.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sintez-main-publication-proof
          path: |
            ${{ runner.temp }}/candidate/release-proof.json
            ${{ runner.temp }}/release-live
