name: Publish only the complete SINTEZ glass review stand
on:
  push:
    branches: [preview/browser]
    paths: ['preview-hosting/sintez-glass/**', '.github/workflows/sintez-glass-preview.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: https://sobaca0808-bit.github.io/kitchen-calculator-test/sintez-glass/
    env:
      APPROVED_MAIN: 9f45d0206022d5cfb66352b5a1518b3ff9a50abc
      PARENT_SOURCE: b44c1f59dc363adb68270dad75056aa0565d78dd
      GLASS_SOURCE: bc61c94cee52cf363ff9e0c750f53bdca68e7f87
      CHECK_RUN: '44209661530'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require unchanged main and exact source on every CI wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test '${{ github.repository }}' = sobaca0808-bit/kitchen-calculator-test
          for ATTEMPT in $(seq 1 120); do
            test "$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)" = "$APPROVED_MAIN"
            test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/sintez-work-modes --jq .object.sha)" = "$PARENT_SOURCE"
            test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/sintez-glass --jq .object.sha)" = "$GLASS_SOURCE"
            test "$(gh api repos/${{ github.repository }}/actions/runs/$CHECK_RUN --jq .head_sha)" = "$GLASS_SOURCE"
            test "$(gh api repos/${{ github.repository }}/actions/runs/$CHECK_RUN --jq .path)" = .github/workflows/sintez-glass.yml
            STATUS="$(gh api repos/${{ github.repository }}/actions/runs/$CHECK_RUN --jq .status)"
            if [ "$STATUS" = completed ]; then break; fi
            echo "Waiting for all candidate checks ($ATTEMPT/120)."
            sleep 12
          done
          test "$(gh api repos/${{ github.repository }}/actions/runs/$CHECK_RUN --jq .conclusion)" = success
      - name: Rebuild the exact old publication and append only the new glass route
        run: python3 preview-hosting/sintez-glass/build.py --pages "$RUNNER_TEMP/modes-site" --proof "$RUNNER_TEMP/modes-publication.json" --source "$GLASS_SOURCE"
      - name: Verify all 464 existing HTTPS resources before publication
        run: python3 preview-hosting/sintez-glass/verify.py "$RUNNER_TEMP/modes-publication.json" --phase before
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/modes-site
      - name: Recheck main, parent and source immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)" = "$APPROVED_MAIN"
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/sintez-work-modes --jq .object.sha)" = "$PARENT_SOURCE"
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/sintez-glass --jq .object.sha)" = "$GLASS_SOURCE"
      - uses: actions/deploy-pages@v4
      - name: Verify all 464 preserved and 64 new HTTPS resources
        run: python3 preview-hosting/sintez-glass/verify.py "$RUNNER_TEMP/modes-publication.json" --phase after
      - name: Install disposable public-browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/modes-tools" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Verify actual HTTPS modes, all palettes, phone layouts, saved data, JSON and A4
        env:
          NODE_PATH: ${{ runner.temp }}/modes-tools/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
          SINTEZ_MODES_ARTIFACTS: ${{ runner.temp }}/modes-live-proof
          SINTEZ_GLASS_ARTIFACTS: ${{ runner.temp }}/glass-live-proof
        run: node preview-hosting/sintez-glass/check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sintez-glass-publication-proof
          path: |
            ${{ runner.temp }}/modes-publication.json
            ${{ runner.temp }}/modes-live-proof
            ${{ runner.temp }}/glass-live-proof
      - name: Report the verified separate glass preview
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'REPORT'
          https://sobaca0808-bit.github.io/kitchen-calculator-test/sintez-glass/

          Only the additional /sintez-glass/ stand was published.
          All 717 earlier files and 464 existing HTTP resources are preserved.
          34 mode and 17 glass-system HTTPS Chrome checks cover phone/desktop, modes, JSON, photos, drafts and A4.
          The five existing SINTEZ test storage names remain shared; no new database or migration.
          Main, all previous stands, existing PWA installations and Pages settings are unchanged.
          Physical Android and owner approval are still required before any main release.
          REPORT
