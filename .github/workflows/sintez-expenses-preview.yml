name: Publish only the unified establishment expenses review
on:
  push:
    branches: [preview/browser]
    paths: ['preview-hosting/sintez-expenses/**', '.github/workflows/sintez-expenses-preview.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: https://sobaca0808-bit.github.io/kitchen-calculator-test/sintez-expenses/
    env:
      APPROVED_MAIN: 9f45d0206022d5cfb66352b5a1518b3ff9a50abc
      PARENT_SOURCE: 471c60944ffe9988f8c9e0a4a4ad2f50a907a9a8
      CLASSIC_SOURCE: 16fb5b490eb57b13254ebefe49f15808793e89f0
      FINANCE_SOURCE: 4cc596363f37b99b8341a822e959fe9a4b28e950
      EXPENSES_SOURCE: c24d201f6889a2362be09f138ae683e35b4e3626
      CHECK_RUN: '44747023105'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require unchanged references before read-only preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test '${{ github.repository }}' = sobaca0808-bit/kitchen-calculator-test
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)" = "$APPROVED_MAIN"
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/home-cookbook-no-finance --jq .object.sha)" = "$PARENT_SOURCE"
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/classic-dark-glass --jq .object.sha)" = "$CLASSIC_SOURCE"
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/financial-journal --jq .object.sha)" = "$FINANCE_SOURCE"
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/unified-establishment-expenses --jq .object.sha)" = "$EXPENSES_SOURCE"
      - name: Rebuild the exact old publication and append only the isolated expenses review route
        run: |
          python3 preview-hosting/sintez-expenses/test_retry.py
          python3 preview-hosting/sintez-expenses/build.py --pages "$RUNNER_TEMP/modes-site" --proof "$RUNNER_TEMP/modes-publication.json" --source "$EXPENSES_SOURCE"
      - name: Verify all 897 existing HTTPS resources before publication
        run: python3 preview-hosting/sintez-expenses/verify.py "$RUNNER_TEMP/modes-publication.json" --phase before
      - name: Require all source checks before any upload or deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test '${{ github.repository }}' = sobaca0808-bit/kitchen-calculator-test
          for ATTEMPT in $(seq 1 120); do
            test "$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)" = "$APPROVED_MAIN"
            test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/home-cookbook-no-finance --jq .object.sha)" = "$PARENT_SOURCE"
            test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/classic-dark-glass --jq .object.sha)" = "$CLASSIC_SOURCE"
            test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/financial-journal --jq .object.sha)" = "$FINANCE_SOURCE"
            test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/unified-establishment-expenses --jq .object.sha)" = "$EXPENSES_SOURCE"
            test "$(gh api repos/${{ github.repository }}/actions/runs/$CHECK_RUN --jq .head_sha)" = "$EXPENSES_SOURCE"
            test "$(gh api repos/${{ github.repository }}/actions/runs/$CHECK_RUN --jq .path)" = .github/workflows/unified-expenses.yml
            STATUS="$(gh api repos/${{ github.repository }}/actions/runs/$CHECK_RUN --jq .status)"
            if [ "$STATUS" = completed ]; then break; fi
            echo "Waiting for all candidate checks ($ATTEMPT/120)."
            sleep 12
          done
          test "$(gh api repos/${{ github.repository }}/actions/runs/$CHECK_RUN --jq .conclusion)" = success
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/modes-site
      - name: Recheck main, parent and source immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)" = "$APPROVED_MAIN"
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/home-cookbook-no-finance --jq .object.sha)" = "$PARENT_SOURCE"
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/classic-dark-glass --jq .object.sha)" = "$CLASSIC_SOURCE"
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/financial-journal --jq .object.sha)" = "$FINANCE_SOURCE"
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/unified-establishment-expenses --jq .object.sha)" = "$EXPENSES_SOURCE"
      - uses: actions/deploy-pages@v4
      - name: Verify all 897 preserved and 80 expenses HTTPS resources
        run: python3 preview-hosting/sintez-expenses/verify.py "$RUNNER_TEMP/modes-publication.json" --phase after
      - name: Install disposable public-browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/modes-tools" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Verify actual HTTPS modes, all palettes, phone layouts, saved data, JSON and A4
        env:
          NODE_PATH: ${{ runner.temp }}/modes-tools/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
          UNIFIED_EXPENSES_ARTIFACTS: ${{ runner.temp }}/expenses-live-proof
        run: node preview-hosting/sintez-expenses/check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sintez-expenses-publication-proof
          path: |
            ${{ runner.temp }}/modes-publication.json
            ${{ runner.temp }}/expenses-live-proof
      - name: Report the verified separate card preview
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'REPORT'
          https://sobaca0808-bit.github.io/kitchen-calculator-test/sintez-expenses/

          Only the additional /sintez-expenses/ draft Pro review was published.
          All 1150 files and 897 HTTP resources of the other existing stands are preserved, including PR40 and PR41.
          The dedicated HTTPS Chrome checks cover journal CRUD, month methods, recurrences, taxes, JSON, quota, old data, offline and full browser restarts.
          The expenses review uses isolated test names in the existing storage engine; no automatic data copy.
          Main, PR38, PR40, PR41, all other stands and Pages settings are unchanged. No PR was merged.
          Physical Android and owner approval are still required before any main release.
          REPORT
