name: Release publication fix checks
on:
  push:
    branches: [fix/pages-release-workflow]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify unchanged approved app and recovery guards
        run: |
          git diff --exit-code 662a12a -- index.html styles.css js assets
          PYTHONDONTWRITEBYTECODE=1 python3 tests/verify-release.test.py
          node --test tests/{calculations,storage,storage-extensions,json-merge,import-transaction,folders,recipe-view,recipe-card-model,profitability,preview-isolation,pages,packaging,drafts,photos,photo-print-selection,appearance,preview-persistence,establishment-expenses,recipe-expense-preferences}.test.js
      - name: Build the same app with all preserved sandboxes
        run: python3 scripts/release-pages.py --output "$RUNNER_TEMP/release-site" --proof "$RUNNER_TEMP/release-proof.json" --legacy-runtime "$RUNNER_TEMP/legacy-runtime.json"
      - name: Verify the known currently published state
        run: python3 scripts/verify-release.py "$RUNNER_TEMP/release-proof.json" --phase before
      - name: Install disposable browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/release-tools" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Verify legacy upgrade and all working-version scenarios locally
        env:
          NODE_PATH: ${{ runner.temp }}/release-tools/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
          KITCHEN_RELEASE_RUNTIME_ROOT: ${{ runner.temp }}/release-site
          KITCHEN_RELEASE_LEGACY_RUNTIME: ${{ runner.temp }}/legacy-runtime.json
          KITCHEN_RELEASE_ARTIFACTS: ${{ runner.temp }}/release-preflight
        run: |
          node tests/release-upgrade.browser.test.js
          node scripts/check-release.cjs
      - name: Save publication validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-publication-checks
          path: |
            ${{ runner.temp }}/release-proof.json
            ${{ runner.temp }}/release-preflight
