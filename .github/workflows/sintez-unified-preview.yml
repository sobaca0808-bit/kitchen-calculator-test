name: Publish only the unified SINTEZ review stand
on:
  push:
    branches: [preview/browser]
    paths: ['preview-hosting/sintez-release/**', '.github/workflows/sintez-unified-preview.yml']
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APPROVED_MAIN: 9f45d0206022d5cfb66352b5a1518b3ff9a50abc
      MERGED_HOME: 59fce080ea4e8dd90dc8cd86e2361323bc81cd3a
      UNIFIED_SOURCE: 9787f93bd83ea19e45a4a376003b33fed3b493c5
      CHECK_RUN: '44152785471'
    environment:
      name: github-pages
      url: https://sobaca0808-bit.github.io/kitchen-calculator-test/sintez-release/presentation.html
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact final CI and unchanged main on every wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test '${{ github.repository }}' = sobaca0808-bit/kitchen-calculator-test
          for ATTEMPT in $(seq 1 120); do
            test "$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)" = "$APPROVED_MAIN"
            test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/sintez-home --jq .object.sha)" = "$MERGED_HOME"
            test "$(gh api repos/${{ github.repository }}/git/ref/heads/release/sintez-safe-release --jq .object.sha)" = "$UNIFIED_SOURCE"
            test "$(gh api repos/${{ github.repository }}/pulls/30 --jq .merged)" = false
            test "$(gh api repos/${{ github.repository }}/actions/runs/$CHECK_RUN --jq .head_sha)" = "$UNIFIED_SOURCE"
            test "$(gh api repos/${{ github.repository }}/actions/runs/$CHECK_RUN --jq .path)" = .github/workflows/sintez-safe-release.yml
            STATUS="$(gh api repos/${{ github.repository }}/actions/runs/$CHECK_RUN --jq .status)"
            if [ "$STATUS" = completed ]; then
              test "$(gh api repos/${{ github.repository }}/actions/runs/$CHECK_RUN --jq .conclusion)" = success
              if FREEZE_SHA="$(gh api repos/${{ github.repository }}/git/ref/tags/release/sintez-unified-candidate-v2 --jq .object.sha 2>/dev/null)"; then
                test "$FREEZE_SHA" = "$UNIFIED_SOURCE"; break
              fi
            fi
            echo "Waiting for the exact candidate checks ($ATTEMPT/120)."
            sleep 12
          done
          test "$(gh api repos/${{ github.repository }}/actions/runs/$CHECK_RUN --jq .conclusion)" = success
          test "$(gh api repos/${{ github.repository }}/git/ref/tags/release/sintez-unified-candidate-v2 --jq .object.sha)" = "$UNIFIED_SOURCE"
      - name: Rebuild the previous site and append only sintez-release
        run: python3 preview-hosting/sintez-release/build.py --pages "$RUNNER_TEMP/unified-site" --proof "$RUNNER_TEMP/unified-publication.json" --source "$UNIFIED_SOURCE"
      - name: Verify all 400 previous HTTPS resources before publication
        run: python3 preview-hosting/sintez-release/verify.py "$RUNNER_TEMP/unified-publication.json" --phase before
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/unified-site
      - name: Recheck the source and main immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)" = "$APPROVED_MAIN"
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/feature/sintez-home --jq .object.sha)" = "$MERGED_HOME"
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/release/sintez-safe-release --jq .object.sha)" = "$UNIFIED_SOURCE"
          test "$(gh api repos/${{ github.repository }}/pulls/30 --jq .merged)" = false
      - name: Publish the separate review route with the prior site preserved
        uses: actions/deploy-pages@v4
      - name: Verify the 343 preserved and 60 current HTTPS resources
        run: python3 preview-hosting/sintez-release/verify.py "$RUNNER_TEMP/unified-publication.json" --phase after
      - name: Prepare disposable Chrome, native-window and PDF checks
        run: |
          npm install --prefix "$RUNNER_TEMP/unified-tools" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils xvfb xauth scrot
      - name: Verify the actual HTTPS presentation, navigation, storage, JSON and A4
        env:
          NODE_PATH: ${{ runner.temp }}/unified-tools/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
          KITCHEN_INTRO_ARTIFACTS: ${{ runner.temp }}/intro-live-proof
          KITCHEN_SINTEZ_ARTIFACTS: ${{ runner.temp }}/home-live-proof
          KITCHEN_ENTRY_ARTIFACTS: ${{ runner.temp }}/entry-live-proof
        run: node preview-hosting/sintez-release/check.cjs
      - name: Install the actual public preview and verify standalone offline relaunch
        env:
          NODE_PATH: ${{ runner.temp }}/unified-tools/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
          SINTEZ_NATIVE_ARTIFACTS: ${{ runner.temp }}/native-live-proof
        run: xvfb-run -a -s '-screen 0 1440x1000x24' node preview-hosting/sintez-release/native-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sintez-unified-publication-proof
          path: |
            ${{ runner.temp }}/unified-publication.json
            ${{ runner.temp }}/intro-live-proof
            ${{ runner.temp }}/home-live-proof
            ${{ runner.temp }}/entry-live-proof
            ${{ runner.temp }}/native-live-proof
      - name: Report the verified separate review URL
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'REPORT'
          https://sobaca0808-bit.github.io/kitchen-calculator-test/sintez-release/presentation.html

          Main, live /pwa/ and older stands are byte-identical; only the existing review stand is updated.
          All 400 prior resources were verified before publication; all 403 current resources after.
          The public URL always starts slide one; the existing installed shortcut bypasses it.
          The new PWA uses the existing SINTEZ test storage and its own installation id.
          Main, the live PWA, Pages settings and all PR merge states were not changed.
          Native desktop installation and offline relaunch passed on this public URL.
          Physical Android installation still needs the owner's manual check.
          REPORT
